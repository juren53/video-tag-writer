name: CI

# Runs the full test suite — including the ExifTool/ffmpeg integration tests on real
# MP4 and MPG clips — on every push and pull request.  VTW_REQUIRE_TOOLS=1 makes a
# missing ExifTool or ffmpeg FAIL the run instead of silently skipping those tests.

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:

env:
  VTW_REQUIRE_TOOLS: "1"
  PYTHONUTF8: "1"

jobs:
  linux:
    name: Linux · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ExifTool and ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libimage-exiftool-perl ffmpeg
          exiftool -ver
          ffprobe -version | head -1

      - name: Install Python dependencies
        # The tests need no GUI packages — only PyExifTool and pytest.
        run: |
          python -m pip install --upgrade pip
          pip install "PyExifTool>=0.5.6" pytest

      - name: Run tests
        run: python -m pytest tests -v --tb=short

  windows:
    # VTW ships as a Windows EXE, and the worst probe finding (non-ASCII text mangled
    # on the command line) was Windows-specific — so the suite runs here too.
    name: Windows · Python 3.12
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ExifTool and ffmpeg
        run: |
          choco install exiftool ffmpeg -y --no-progress
          exiftool -ver
          ffprobe -version | Select-Object -First 1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "PyExifTool>=0.5.6" pytest

      - name: Run tests
        run: python -m pytest tests -v --tb=short
